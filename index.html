  <script>



  /* =====================================

  ===================================== */

  // Tabelle mit allen Daten
  let data = [];

  // Kommentare pro Datum
  let comments = {};

  // aktuelles Kommentar Datum
  let currentCommentDate = null;

  // Initialisierung fertig?
  let initialized = false;

  // Timer für Autosave
  let saveTimer = null;



 


  /* =====================================
     TOOLTIP FUNKTIONEN
  ===================================== */

  function showTip(text, x, y) {

    let tip = document.getElementById("commentTip");

    tip.innerText = text;

    tip.style.left = x + "px";
    tip.style.top = y + "px";

    tip.style.display = "block";

  }


  function hideTip() {

    document.getElementById("commentTip").style.display = "none";

  }



  /* =====================================
     COMMENT FUNCTIONS
  ===================================== */

  function openComment(date) {

    currentCommentDate = date;

    document.getElementById("commentTitle").innerText =
      "Kommentar " + date;

    document.getElementById("commentText").value =
      comments[date] || "";

    document.getElementById("commentBox").style.display =
      "block";

  }


  function closeComment() {

    document.getElementById("commentBox").style.display =
      "none";

  }


  function saveComment() {

    comments[currentCommentDate] =
      document.getElementById("commentText").value;

    closeComment();

    save();
    draw();

  }

/* =====================================
   DATUM ERMITTELN
   Unterstützt Jahreswechsel
===================================== */

function getDateObject(text) {

    const p = text.split(".");

    if (p.length < 2) return null;

    const day = parseInt(p[0], 10);
    const month = parseInt(p[1], 10) - 1;

    const today = new Date();

    let year = today.getFullYear();

    let date = new Date(year, month, day);

    // Wenn das Datum bereits vorbei ist,
    // aber mehr als 6 Monate zurückliegt,
    // gehört es wahrscheinlich ins nächste Jahr.
    if (
        date < today &&
        (today.getMonth() - month) > 6
    ) {

        date = new Date(year + 1, month, day);

    }

    return date;

}


/* =====================================
   DATUM PARSEN
   TT.MM.JJJJ
===================================== */

function parseDate(text) {

    if (!text) return null;

    const p = text.split(".");

    if (p.length !== 3)
        return null;

    const day = parseInt(p[0], 10);
    const month = parseInt(p[1], 10) - 1;
    const year = parseInt(p[2], 10);

    return new Date(year, month, day);

}

    
  /* =====================================
   WEEKEND ERKENNEN
===================================== */

function isWeekend(text) {

    const date = parseDate(text);

    if (!date) return false;

    const day = date.getDay();

    return day === 0 || day === 6;

}



  /* =====================================
   HEUTE ERKENNEN
===================================== */

function isToday(text) {

    const date = parseDate(text);

    if (!date) return false;

    const today = new Date();

    return (
        date.getDate() === today.getDate() &&
        date.getMonth() === today.getMonth() &&
        date.getFullYear() === today.getFullYear()
    );

}



 /* =====================================
   ZUKUNFT ODER HEUTE
===================================== */

function isFutureOrToday(text) {

    const date = parseDate(text);

    if (!date)
        return true;

    const today = new Date();

    today.setHours(0, 0, 0, 0);
    date.setHours(0, 0, 0, 0);

    return date >= today;

}
    
  /* =====================================
   CSV SYNCHRONISIEREN
===================================== */

/* =====================================
   CSV SYNCHRONISIEREN
===================================== */

async function synchronizeCSV() {

    try {

        // Tages-Backup erstellen
        await createDailyBackup();

        // CSV einlesen
        const csv = await loadCSV();

        // Firestore lesen
        const doc = await db
            .collection("training")
            .doc("list")
            .get();

        let dbData = [];

        if (doc.exists && doc.data().json) {

            dbData = JSON.parse(doc.data().json);

        }

        // Daten zusammenführen
        const merged = mergeData(csv, dbData);

        // Kommentare beibehalten
        const comments = doc.exists
            ? (doc.data().comments || {})
            : {};

        // Firestore speichern
        await db
            .collection("training")
            .doc("list")
            .set({

                json: JSON.stringify(merged),
                comments: comments

            });

        // Tabelle neu laden
        await load();

        alert("CSV erfolgreich synchronisiert.");

    }

    catch (err) {

        console.error(err);

        alert("Fehler beim Synchronisieren.");

    }

}


/* =====================================
   TAGES-BACKUP
   Wird maximal 1x pro Tag erstellt
===================================== */

async function createDailyBackup() {

    const today =
        new Date()
            .toISOString()
            .substring(0, 10);

    const backupRef =
        db.collection("backup").doc(today);

    const backupDoc =
        await backupRef.get();

    // Existiert bereits → nichts machen
    if (backupDoc.exists) {

        return;

    }

    // Aktuelle Daten lesen
    const doc = await db
        .collection("training")
        .doc("list")
        .get();

    if (!doc.exists) {

        return;

    }

    // Backup speichern
    await backupRef.set({

        created: firebase.firestore.FieldValue.serverTimestamp(),

        version: "3.0.0",

        json: doc.data().json || "",

        comments: doc.data().comments || {}

    });


}

/* =====================================
   BACKUPS AUFLISTEN
===================================== */

async function listBackups() {

    try {

        const snapshot = await db
            .collection("backup")
            .get();

        const backups = [];

        snapshot.forEach(doc => {

            backups.push(doc.id);

        });

        // Neueste zuerst
        backups.sort().reverse();

        return backups;

    }

    catch (err) {

        console.error(err);

        return [];

    }

}

/* =====================================
   BACKUP WIEDERHERSTELLEN
===================================== */

async function restoreBackup() {

    // Alle Backups lesen
    const backups = await listBackups();

    if (backups.length === 0) {

        alert("Keine Backups vorhanden.");

        return;

    }

    // Backup auswählen
    const selected = prompt(

        "Welches Backup wiederherstellen?\n\n" +

        backups.join("\n")

    );

    if (!selected)
        return;

    // Backup laden
    const doc = await db
        .collection("backup")
        .doc(selected)
        .get();

    if (!doc.exists) {

        alert("Backup nicht gefunden.");

        return;

    }

    // Sicherheit
    if (!confirm("Backup " + selected + " wirklich wiederherstellen?"))
        return;

    // Training überschreiben
    await db
        .collection("training")
        .doc("list")
        .set({

            json: doc.data().json,

            comments: doc.data().comments || {}

        });

    // Neu laden
    await load();

    alert("Backup erfolgreich wiederhergestellt.");

}


    /* =====================================
   DATUM FORMATIEREN
   Anzeige: TT.MM
===================================== */

function formatDate(text) {

    if (!text)
        return "";

    // TT.MM.JJJJ -> TT.MM
    if (text.length >= 10)
        return text.substring(0, 5);

    return text;

}

  /* =====================================
     DRAW TABLE
     → baut komplette Tabelle neu
  ===================================== */

  function draw() {

    let t = document.getElementById("t");

    t.innerHTML = "";

    if (!data.length) return;




    /* =====================================
       Sichtbare Spalten bestimmen
       → nur Zukunft anzeigen
    ===================================== */

    let visibleCols = [];

for (let c = 0; c < data[0].length; c++) {

    if (c === 0) {

        visibleCols.push(c);
        continue;

    }




  
    if (isFutureOrToday(data[0][c])) {

        visibleCols.push(c);

    }

}


    /* =====================================
       Total zählen
    ===================================== */

    let counts =
      new Array(data[0].length).fill(0);

    for (let r = 2; r < data.length; r++) {

      for (let c = 1; c < data[0].length; c++) {

        if (data[r][c] === "ja") {

          counts[c]++;

        }

      }

    }


    /* =====================================
       HEADER (Datum)
    ===================================== */

    let trHead =
      document.createElement("tr");

    visibleCols.forEach(c => {

      let th =
        document.createElement("th");

      let val =
        data[0][c] || "";

      th.textContent = formatDate(val);


      /* Kommentar vorhanden */

      if (comments[val]) {

        th.innerHTML += " 💬";


        th.onmouseover = (e) => {

          showTip(
            comments[val],
            e.pageX + 10,
            e.pageY + 10
          );

        };


        th.onmouseout = () => {

          hideTip();

        };


        th.onclick = () => {

          openComment(val);

        };

      }

      else {

        th.onclick = () => {

          openComment(val);

        };

      }


      if (isWeekend(val))
        th.classList.add("weekend");

      if (isToday(val))
        th.classList.add("today");


      trHead.appendChild(th);

    });

    t.appendChild(trHead);



    /* =====================================
       TYPE ROW
    ===================================== */

    let trType =
      document.createElement("tr");

    visibleCols.forEach(c => {

      let td =
        document.createElement("td");

      let val =
        data[1]?.[c] || "";

      td.innerHTML = val;

      if (c === 0)
        td.className = "name";

      td.style.fontSize = "12px";
      td.style.color = "#555";

      if (val === "Spiel") {

        td.style.fontWeight = "bold";

      }

      trType.appendChild(td);

    });

    t.appendChild(trType);



    /* =====================================
       TOTAL ROW
    ===================================== */

    let trTotal =
      document.createElement("tr");

    visibleCols.forEach(c => {

      let td =
        document.createElement("td");

      if (c === 0) {

        td.textContent = "Total";
        td.className = "name";

      }

      else {

        td.textContent = counts[c];
        td.className = "count";

      }

      trTotal.appendChild(td);

    });

    t.appendChild(trTotal);



    /* =====================================
       PLAYERS
    ===================================== */

    for (let r = 2; r < data.length; r++) {

      let tr =
        document.createElement("tr");

      visibleCols.forEach(c => {

        let td =
          document.createElement("td");

        let val =
          data[r][c] || "";


        /* Name */

        if (c === 0) {

          td.textContent = val;
          td.className = "name";

        }

        /* Teilnahme */

        else {

          td.onclick = () => {

            td.classList.add("tap");

            setTimeout(() => {

              td.classList.remove("tap");

            }, 150);


            let order =
              ["", "ja", "ev", "nein"];

            let i =
              order.indexOf(data[r][c]);

            i++;

            if (i >= order.length)
              i = 0;

            data[r][c] = order[i];

            draw();
            autoSave();

          };


          if (val) {

            let dot =
              document.createElement("div");

            dot.className = "dot";

            if (val === "ja")
              dot.classList.add("dot-ja");

            if (val === "ev")
              dot.classList.add("dot-ev");

            if (val === "nein")
              dot.classList.add("dot-nein");

            td.appendChild(dot);

          }

        }

        tr.appendChild(td);

      });

      t.appendChild(tr);

    }



    /* =====================================
       BOTTOM DATE
    ===================================== */

    let trBottom =
      document.createElement("tr");

    visibleCols.forEach(c => {

      let th =
        document.createElement("th");

      let val =
        data[0][c] || "";

     th.textContent = formatDate(val);

      if (isWeekend(val))
        th.classList.add("weekend");

      if (isToday(val))
        th.classList.add("today");

      trBottom.appendChild(th);

    });

    t.appendChild(trBottom);



    /* =====================================
       BOTTOM TYPE
    ===================================== */

    let trTypeBottom =
      document.createElement("tr");

    visibleCols.forEach(c => {

      let td =
        document.createElement("td");

      let val =
        data[1]?.[c] || "";

      td.textContent = val;

      if (val === "Spiel") {

        td.style.fontWeight = "bold";

      }

      if (c === 0)
        td.className = "name";

      td.style.fontSize = "12px";
      td.style.color = "#555";

      trTypeBottom.appendChild(td);

    });

    t.appendChild(trTypeBottom);

  }


  /* =====================================
     LOAD
     → CSV laden
     → Firebase laden
     → zusammenführen

/* =====================================
   LOAD
   -------------------------------------
   Ablauf:

   1. CSV laden (Struktur)
   2. Firestore laden (Daten + Kommentare)
   3. Wenn DB leer → CSV verwenden
   4. CSV + DB zusammenführen
   5. Falls nötig → DB neu speichern
   6. Tabelle zeichnen

   Diese Version ist stabil für:

   ✔ leere DB
   ✔ fehlendes json
   ✔ kaputtes json
   ✔ neue CSV
   ✔ neue Firebase
   ✔ Test / Prod
===================================== */
